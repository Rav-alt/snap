[package]
name = "snap"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: system tray support. image-png: decode the PNG tray icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Extracts a file's Windows shell icon (embedded .exe icon) as PNG bytes.
systemicons = "0.9"
# Encodes the PNG bytes as base64 for a data: URL the frontend can show.
base64 = "0.22"
# Global keyboard shortcuts that work even when Snap isn't focused.
tauri-plugin-global-shortcut = "2"
# Start Snap automatically when the user logs in to Windows.
tauri-plugin-autostart = "2"
# Position non-browser app windows after they launch (Win32 API).
winapi = { version = "0.3", features = ["winuser", "windef", "minwindef"] }
# Read the active window's position/size (for the "Capture" button).
winapi = { version = "0.3", features = ["winuser", "windef"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
